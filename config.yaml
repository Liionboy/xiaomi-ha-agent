name: Xiaomi Home Assistant Agent
version: 0.1.5
slug: xiaomi_ha_agent
description: AI-powered configuration assistant for Home Assistant, powered by Xiaomi MiMo
url: https://github.com/Liionboy/xiaomi-ha-agent
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
hassio_api: true
homeassistant_api: true
hassio_role: manager
ingress: true
ingress_port: 8100
panel_icon: mdi:robot
panel_title: Xiaomi AI
map:
  - config:rw
  - backup:rw
options:
  xiaomi_api_key: ""
  xiaomi_api_base: "https://api.xiaomi.com/v1"
  xiaomi_model: "mimo-v2.6-pro"
  max_tokens: 4096
  temperature: 0.7
  system_prompt: |
    You are a helpful Home Assistant configuration assistant powered by Xiaomi MiMo.
    You help users create and manage their smart home configuration.
    Always validate changes before applying them and explain what you're doing.
schema:
  xiaomi_api_key: password
  xiaomi_api_base: str
  xiaomi_model: str
  max_tokens: int
  temperature: float
  system_prompt: str
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: Web UI
