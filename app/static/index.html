<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiaomi HA Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.65rem 1rem;
            font-size: 1.15rem;
            font-weight: 600;
            flex-shrink: 0;
        }
        .container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 240px;
            background: white;
            border-right: 1px solid #e0e0e0;
            padding: 0.75rem;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar h3 {
            margin-bottom: 0.5rem;
            color: #333;
            font-size: 0.95rem;
        }
        .tool-item {
            padding: 0.5rem;
            margin-bottom: 0.3rem;
            background: #f8f9fa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: background 0.15s;
        }
        .tool-item:hover { background: #e9ecef; }
        .tool-item .t-name { font-weight: 600; color: #333; }
        .tool-item .t-desc { color: #666; font-size: 0.75rem; margin-top: 0.15rem; }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            overflow: hidden;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem;
        }
        .msg {
            margin-bottom: 0.35rem;
            padding: 0.55rem 0.75rem;
            border-radius: 10px;
            max-width: 88%;
            line-height: 1.45;
            font-size: 0.92rem;
        }
        .msg.user {
            background: #667eea;
            color: white;
            margin-left: auto;
        }
        .msg.assistant {
            background: #f0f0f0;
            color: #222;
            margin-right: auto;
        }
        .msg .role {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            opacity: 0.65;
            margin-bottom: 0.25rem;
        }
        .msg .content {
            word-wrap: break-word;
        }
        .msg .content h2, .msg .content h3, .msg .content h4 {
            margin: 0.45rem 0 0.25rem;
            line-height: 1.25;
        }
        .msg .content h2 { font-size: 1.15rem; }
        .msg .content h3 { font-size: 1.05rem; }
        .msg .content h4 { font-size: 0.98rem; }
        .msg .content p { margin: 0.25rem 0; }
        .msg .content ul, .msg .content ol {
            margin: 0.25rem 0 0.25rem 1.15rem;
            padding: 0;
        }
        .msg .content li { margin: 0.12rem 0; }
        .msg .content code {
            background: rgba(0,0,0,0.08);
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.85em;
        }
        .msg .content pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 0.65rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 0.35rem 0;
        }
        .msg .content pre code {
            background: none;
            padding: 0;
            color: inherit;
        }
        .msg .content strong { font-weight: 600; }
        .tool-call {
            background: #fff3cd;
            border-left: 3px solid #ffc107;
            padding: 0.45rem 0.65rem;
            margin: 0.35rem 0;
            border-radius: 5px;
            font-size: 0.82rem;
            max-width: 88%;
        }
        .tool-call strong { color: #856404; }
        .input-container {
            padding: 0.65rem;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        .input-wrapper {
            display: flex;
            gap: 0.4rem;
        }
        .input-wrapper textarea {
            flex: 1;
            padding: 0.55rem 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: none;
            font-family: inherit;
            font-size: 0.95rem;
            min-height: 44px;
            max-height: 130px;
            outline: none;
        }
        .input-wrapper textarea:focus { border-color: #667eea; }
        .input-wrapper button {
            padding: 0.55rem 1.35rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .input-wrapper button:hover { opacity: 0.92; }
        .input-wrapper button:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading {
            display: none;
            padding: 0.5rem;
            text-align: center;
            color: #888;
            font-size: 0.88rem;
        }
        .loading.active { display: block; }
        .typing {
            display: inline-block;
            width: 18px;
            height: 3px;
            background: #667eea;
            border-radius: 2px;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-right: 0.35rem;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <header>🤖 Xiaomi Home Assistant Agent</header>

    <div class="container">
        <aside class="sidebar">
            <h3>🛠️ Tools</h3>
            <div id="tools-list">
                <div style="color:#999;font-size:0.82rem;padding:0.5rem;">Loading tools...</div>
            </div>
        </aside>

        <main class="main">
            <div class="chat-container" id="chat-container">
                <div class="msg assistant">
                    <div class="role">Xiaomi MiMo</div>
                    <div class="content">Hello! I'm your Xiaomi Home Assistant AI. I can help you create automations, control devices, validate your setup, and more. What would you like to do?</div>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="typing"></div> Thinking...
            </div>

            <div class="input-container">
                <div class="input-wrapper">
                    <textarea id="message-input" placeholder="Ask me anything..." rows="2"></textarea>
                    <button id="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = window.location.pathname.replace(/\/[^\/]*$/, '');
        let conversationHistory = [];
        let isSending = false;

        // Simple markdown parser (no CDN dependency)
        function renderMarkdown(text) {
            // Strip function/tool call markup
            text = text.replace(/<function=[^>]*>/g, '').replace(/<\/function>/g, '');
            text = text.replace(/<parameter=[^>]*>/g, '').replace(/<\/parameter>/g, '');

            // Escape HTML
            text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // Code blocks
            text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            // Inline code
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            // Bold
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            // Italic
            text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            // Headers
            text = text.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
            text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            text = text.replace(/^# (.+)$/gm, '<h2>$1</h2>');
            // Unordered lists
            text = text.replace(/^[\s]*[-*] (.+)$/gm, '<li>$1</li>');
            // Wrap consecutive <li> in <ul>
            text = text.replace(/((?:<li>.*?<\/li>\s*)+)/g, '<ul>$1</ul>');
            // Ordered lists
            text = text.replace(/^[\s]*\d+\. (.+)$/gm, '<li>$1</li>');
            // Paragraphs
            text = text.replace(/\n\n/g, '</p><p>');
            text = text.replace(/\n/g, '<br>');
            text = '<p>' + text + '</p>';

            return text;
        }

        // Load tools
        async function loadTools() {
            try {
                const resp = await fetch(`${API_BASE}/api/tools/list`);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                const el = document.getElementById('tools-list');

                if (data.tools && data.tools.length > 0) {
                    el.innerHTML = data.tools.map(t => `
                        <div class="tool-item" onclick="showToolInfo('${t.name}')" title="${t.description}">
                            <div class="t-name">${t.name}</div>
                            <div class="t-desc">${t.description}</div>
                        </div>
                    `).join('');
                } else {
                    el.innerHTML = '<div style="color:#e74c3c;padding:0.5rem;font-size:0.82rem;">No tools found</div>';
                }
            } catch (err) {
                console.error('Load tools error:', err);
                document.getElementById('tools-list').innerHTML =
                    `<div style="color:#e74c3c;padding:0.5rem;font-size:0.82rem;">Failed to load tools: ${err.message}</div>`;
            }
        }

        async function showToolInfo(name) {
            try {
                const resp = await fetch(`${API_BASE}/api/tools/info/${name}`);
                const d = await resp.json();
                const params = (d.parameters || []).map(p => `• ${p.name} (${p.type}): ${p.description}`).join('\n');
                alert(`${d.name}\n\n${d.description}\n\nParameters:\n${params || '(none)'}`);
            } catch (e) {
                alert(`Tool: ${name}`);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message || isSending) return;

            isSending = true;
            addMessage('user', message);
            input.value = '';
            document.getElementById('loading').classList.add('active');
            document.getElementById('send-btn').disabled = true;

            conversationHistory.push({ role: 'user', content: message });

            try {
                const resp = await fetch(`${API_BASE}/api/chat/completion`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: conversationHistory, use_tools: true }),
                });

                if (!resp.ok) {
                    const errData = await resp.json().catch(() => ({}));
                    throw new Error(errData.detail || `HTTP ${resp.status}`);
                }

                const data = await resp.json();

                // Show tool calls if any
                if (data.tool_calls && data.tool_calls.length > 0) {
                    data.tool_calls.forEach(tc => {
                        addToolCall(tc.name, tc.arguments);
                    });
                }

                addMessage('assistant', data.message.content);
                conversationHistory.push({ role: 'assistant', content: data.message.content });
                saveConversation();

            } catch (err) {
                console.error('Chat error:', err);
                addMessage('assistant', `⚠️ **Error:** ${err.message}`);
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('send-btn').disabled = false;
                isSending = false;
            }
        }

        function addMessage(role, content) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            const rendered = role === 'assistant' ? renderMarkdown(content) : content.replace(/\n/g, '<br>');
            div.innerHTML = `<div class="role">${role === 'user' ? 'You' : 'Xiaomi MiMo'}</div><div class="content">${rendered}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addToolCall(name, args) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = 'tool-call';
            const argsStr = typeof args === 'string' ? args : JSON.stringify(args, null, 2);
            div.innerHTML = `<strong>🔧 ${name}</strong><br><small>${argsStr}</small>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function saveConversation() {
            try { localStorage.setItem('xiaomi_ha_chat', JSON.stringify(conversationHistory)); } catch(e) {}
        }

        function loadConversation() {
            try {
                const saved = localStorage.getItem('xiaomi_ha_chat');
                if (saved) {
                    conversationHistory = JSON.parse(saved);
                    const container = document.getElementById('chat-container');
                    if (conversationHistory.length > 0) {
                        container.innerHTML = '';
                        conversationHistory.forEach(m => addMessage(m.role, m.content));
                    }
                }
            } catch(e) {}
        }

        // Enter key sends
        document.getElementById('message-input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        window.clearChat = function() {
            localStorage.removeItem('xiaomi_ha_chat');
            conversationHistory = [];
            location.reload();
        };

        // Init
        loadTools();
        loadConversation();
    </script>
</body>
</html>
